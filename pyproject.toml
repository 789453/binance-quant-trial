[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-quant-trial"
version = "0.1.0"
description = "Causal crypto factor research and Freqtrade deployment bridge"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
